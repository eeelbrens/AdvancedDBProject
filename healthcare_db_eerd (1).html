
<div id="erd" style="padding: 8px 0;"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: false,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: '#73726c',
    textColor: '#3d3d3a',
    primaryColor: '#f5f4ef',
    primaryBorderColor: '#B4B2A9',
  },
});

const diagram = `erDiagram
  SPECIALIZATION {
    int SpecializationID PK
    varchar Name
  }
  DOCTOR {
    int DoctorID PK
    varchar Name
    varchar Phone
    int SpecializationID FK
  }
  PATIENT {
    int PatientID PK
    varchar Name
    varchar Gender
    date DateOfBirth
    varchar Phone
  }
  SCHEDULE {
    int ScheduleID PK
    int DoctorID FK
    date AvailableDate
    time AvailableTime
  }
  APPOINTMENT {
    int AppointmentID PK
    int PatientID FK
    int DoctorID FK
    datetime AppointmentDate
    varchar Status
  }
  PRESCRIPTION {
    int PrescriptionID PK
    int AppointmentID FK
    varchar Notes
  }
  MEDICATION {
    int MedicationID PK
    varchar Name
    varchar Description
  }
  PRESCRIPTIONDETAILS {
    int PrescriptionID FK
    int MedicationID FK
    varchar Dosage
  }

  SPECIALIZATION ||--o{ DOCTOR : "has"
  DOCTOR ||--o{ SCHEDULE : "has"
  DOCTOR ||--o{ APPOINTMENT : "attends"
  PATIENT ||--o{ APPOINTMENT : "books"
  APPOINTMENT ||--o| PRESCRIPTION : "generates"
  PRESCRIPTION ||--o{ PRESCRIPTIONDETAILS : "includes"
  MEDICATION ||--o{ PRESCRIPTIONDETAILS : "listed in"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});

const erdSvg = document.querySelector('#erd svg');
if (erdSvg) {
  erdSvg.style.width = '100%';
  erdSvg.style.maxWidth = '100%';
}
</script>
